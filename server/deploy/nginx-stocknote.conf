# 交易日记同步服务：独立端口，不影响服务器上已有站点。
# 证书：未备案域名无法在 80/443 签发正规证书，先用自签证书（App 内固定指纹校验）。
server {
    # nginx 1.24 不支持独立的 `http2 on;`，用 listen 行内参数
    listen 8443 ssl http2;
    server_name stock.ainewstrding.top 121.199.17.162;

    ssl_certificate     /etc/stocknote/tls/cert.pem;
    ssl_certificate_key /etc/stocknote/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:stocknote:1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # 管理后台（Vue 静态文件）
    location / {
        root /opt/stocknote/web;
        try_files $uri $uri/ /index.html;
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
