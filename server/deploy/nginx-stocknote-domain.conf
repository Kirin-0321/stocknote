# 管理后台 / 同步 API 的域名访问（与服务器上其他站点相同：acme.sh webroot 签发证书）。
# 证书：acme.sh --issue -d stocknote.ainewstrding.top -w /var/www/html
#       安装到 /etc/nginx/ssl/stocknote.ainewstrding.top/
server {
    listen 80;
    listen [::]:80;
    server_name stocknote.ainewstrding.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stocknote.ainewstrding.top;

    ssl_certificate     /etc/nginx/ssl/stocknote.ainewstrding.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/stocknote.ainewstrding.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        root /opt/stocknote/web;
        try_files $uri $uri/ /index.html;
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
